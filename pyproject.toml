[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fens"
version = "0.1.0"
description = "Clean from-scratch PyTorch implementation of FENS: Revisiting Ensembling in One-Shot Federated Learning (NeurIPS 2024)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FENS Reproduction Project"}
]
# Core dependencies (already pre-installed in the `qwen-vl` Conda environment on `rama`)
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
